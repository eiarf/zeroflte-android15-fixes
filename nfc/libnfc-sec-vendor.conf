# Samsung S3FWRN5 NFC HAL vendor configuration for Galaxy S6 (zeroflte)
SLEEP_TIMEOUT=1000
WAKEUP_DELAY=20
POWER_DRIVER="/dev/sec-nfc"
TRANS_DRIVER="/dev/sec-nfc"
FW_DIR_PATH="/vendor/firmware/nfc/"
FW_FILE_NAME="sec_s3fwrn5p_firmware.bin"
RF_DIR_PATH="/vendor/etc/nfc/"
RF_FILE_NAME="sec_s3fwrn5p_rfreg.bin"
FW_IMAGE="/vendor/firmware/nfc/sec_s3fwrn5p_firmware.bin"
RFREG_FILE="/vendor/etc/nfc/sec_s3fwrn5p_rfreg.bin"
FW_UPDATE_MODE=0
FW_CFG_CLK_TYPE=1
FW_CFG_CLK_SPEED=24
FW_CFG_CLK_REQ=1
TRACE_LEVEL=2
DATA_TRACE=0
